name: 주간 재분석 및 배포

on:
  schedule:
    # 토 15:30 UTC = 일 00:30 KST. 추첨(토 20:35 KST)과 데이터 미러 갱신(21:00 KST) 이후.
    - cron: "30 15 * * 6"
  workflow_dispatch:          # 수동 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 회차별 원본 JSON 캐시. 매주 신규 회차만 내려받으면 되도록 유지한다.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: lotto-raw-${{ github.run_id }}
          restore-keys: lotto-raw-

      - name: 데이터 수집 및 전체 재분석
        run: python scripts/build.py
        working-directory: .

      - name: 산출물 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data data/draws.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 새 회차가 아직 없습니다."
          else
            git commit -m "주간 갱신: $(python -c "import json;print(json.load(open('web/data/meta.json'))['latest_draw'])")회"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
